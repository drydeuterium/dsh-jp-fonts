<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>font identification bands</title>
<style>
  /* Nine fixed 64px bands. The first five are single-family references, the last
     four are the dsh stacks under test. identify-fonts.py slices them by y. */
  html, body { margin: 0; padding: 0; background: #fff; }
  .band { height: 64px; box-sizing: border-box; padding: 18px 24px 0; white-space: nowrap; font-size: 16px; }
  .band + .band { border-top: 1px solid #eee; }

  .ref-yahei   { font-family: "Microsoft YaHei"; }
  .ref-yugoth  { font-family: "Yu Gothic UI"; }
  .ref-meiryo  { font-family: Meiryo; }
  .ref-msgothic{ font-family: "MS Gothic"; }
  .ref-bizud   { font-family: "BIZ UDGothic"; }

  .before-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .after-text  { font-family: "Segoe UI", "Yu Gothic UI", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .before-code { font-family: "SF Mono", "JetBrains Mono", "Fira Code", Consolas, "Liberation Mono", Menlo, Courier, "PingFang SC", "Microsoft YaHei"; }
  .after-code  { font-family: Consolas, "MS Gothic", "SF Mono", "JetBrains Mono", "Fira Code", Consolas, "Liberation Mono", Menlo, Courier, "PingFang SC", "Microsoft YaHei"; }
</style>
</head>
<body>
<div class="band ref-yahei">骨直画今令海過真者毎兌郎涼化巨及曜</div>
<div class="band ref-yugoth">骨直画今令海過真者毎兌郎涼化巨及曜</div>
<div class="band ref-meiryo">骨直画今令海過真者毎兌郎涼化巨及曜</div>
<div class="band ref-msgothic">骨直画今令海過真者毎兌郎涼化巨及曜</div>
<div class="band ref-bizud">骨直画今令海過真者毎兌郎涼化巨及曜</div>
<div class="band before-text">骨直画今令海過真者毎兌郎涼化巨及曜</div>
<div class="band after-text">骨直画今令海過真者毎兌郎涼化巨及曜</div>
<div class="band before-code">骨直画今令海過真者毎兌郎涼化巨及曜</div>
<div class="band after-code">骨直画今令海過真者毎兌郎涼化巨及曜</div>
</body>
</html>
